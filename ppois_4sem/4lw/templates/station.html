<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ station.name }} - Metro System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #083b6e;
            color: white;
            text-align: center;
        }
        .station-card {
            background: #1a4f8b;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 600px;
            border-radius: 10px;
        }
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1e94ef;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>{{ station.name }}</h1>
    <div class="station-card">
        <h2>Line: {{ station.line }}</h2>
        <p>Station ID: {{ station.id }}</p>
        <!-- Добавьте другие данные станции -->
    </div>
    <a href="/" class="back-button">Back to Main</a>
</body>
</html>
