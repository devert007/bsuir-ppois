<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ station.name }} - Metro System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --danger: #dc2626;
            --warning: #f59e0b;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .station-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .station-card {
            background: var(--surface);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .passenger-section {
            margin-top: 3rem;
        }

        .passenger-form {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .input-field {
            padding: 0.875rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .button {
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .button-primary {
            background: var(--primary);
            color: white;
        }

        .button-success {
            background: var(--success);
            color: white;
        }

        .button-warning {
            background: var(--warning);
            color: white;
        }

        .button-danger {
            background: var(--danger);
            color: white;
        }

        .passenger-list {
            display: grid;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .passenger-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.5rem;
            align-items: center;
        }

        .passenger-info {
            display: grid;
            gap: 0.5rem;
        }

        .passenger-meta {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .balance-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .tariff-badge {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .active {
            background: var(--success);
        }

        .inactive {
            background: var(--danger);
        }

        .actions-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 250px;
        }

        .action-group {
            display: flex;
            gap: 0.5rem;
        }

        .tariff-select {
            padding: 0.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            width: 100%;
        }

        .topup-input {
            padding: 0.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="station-header">
            <h1>{{ station.name }} Station</h1>
            <p>Line: {{ station.line }} • ID: {{ station.id }}</p>
        </div>

        <div class="station-card">
            <div class="passenger-section">
                <h2>Passenger Management</h2>
                
                <!-- Create Passenger Form -->
                <div class="passenger-form">
                    <input 
                        type="text" 
                        id="passengerName" 
                        class="input-field"
                        placeholder="Enter passenger name"
                    >
                    <button 
                        class="button button-primary"
                        onclick="createPassenger({{ station.id }})"
                    >
                        <i class="fas fa-user-plus"></i>
                        Create Passenger
                    </button>
                </div>

                <!-- Passengers List -->
                <div class="passenger-list" id="passengerList">
                </div>
            </div>
        </div>

        <a href="/" class="button button-primary">
            <i class="fas fa-arrow-left"></i>
            Back to Main
        </a>
    </div>

    <script>
        // Initialize tariffs dropdown
        let tariffs = [];
        
        async function loadTariffs() {
            const response = await fetch('/tariffs');
            tariffs = await response.json();
        }

        // Load initial data
        document.addEventListener('DOMContentLoaded', async () => {
            await loadTariffs();
            await loadPassengers({{ station.id }});
        });

        // Load passengers for station
        async function loadPassengers(stationId) {
            try {
                const response = await fetch(`/stations/${stationId}/passengers`);
                const data = await response.json();
                // Добавить проверку данных
                console.log("Received passengers data:", data); 
                renderPassengers(data.passengers);
            } catch (error) {
                console.error("Error loading passengers:", error);
                showNotification('Error loading passengers', 'error');
            }
        }

        // Render passengers list
        function renderPassengers(passengers) {
            const container = document.getElementById('passengerList');
            container.innerHTML = '';

            passengers.forEach(passenger => {
                const passengerEl = document.createElement('div');
                passengerEl.className = 'passenger-card';
                passengerEl.innerHTML = `
                    <div class="passenger-info">
                        <h3>${passenger.name}</h3>
                        <div class="passenger-meta">
                            <span class="badge balance-badge">
                                $${passenger.balance.toFixed(2)}
                            </span>
                            <span class="badge tariff-badge">
                                ${passenger.tariff}
                            </span>
                            <span class="status-indicator ${passenger.is_active ? 'active' : 'inactive'}"></span>
                        </div>
                    </div>
                    <div class="actions-container">
                         <div class="action-group">
                            <input 
                                type="number" 
                                class="topup-input" 
                                placeholder="Amount"
                                id="balance-${passenger.id}"
                                step="0.01"
                                min="0"
                            >
                            <button class="button button-success" onclick="adjustBalance(${passenger.id}, 'add')">
                                <i class="fas fa-plus"></i>
                            </button>
                            <button class="button button-warning" onclick="adjustBalance(${passenger.id}, 'subtract')">
                                <i class="fas fa-minus"></i>
                            </button>
                        </div>
                        
                        <div class="action-group">
                            <select 
                                class="tariff-select" 
                                id="tariff-${passenger.id}"
                                onchange="updateTariff(${passenger.id}, this.value)"
                            >
                                ${tariffs.map(t => `
                                    <option value="${t.id}" ${t.name === passenger.tariff ? 'selected' : ''}>
                                        ${t.name} ($${t.price.toFixed(2)})
                                    </option>
                                `).join('')}
                            </select>
                        </div>

                        <button 
                            class="button ${passenger.is_active ? 'button-danger' : 'button-success'}"
                            onclick="togglePassengerStatus(${passenger.id})"
                        >
                            <i class="fas fa-${passenger.is_active ? 'lock' : 'unlock'}"></i>
                            ${passenger.is_active ? 'Block' : 'Unblock'}
                        </button>
                    </div>
                `;
                container.appendChild(passengerEl);
            });
        }

        async function adjustBalance(passengerId, operation) {
    const input = document.getElementById(`balance-${passengerId}`);
    let amount = parseFloat(input.value);

    if (isNaN(amount) || amount <= 0) {
        showNotification('Please enter valid positive amount', 'warning');
        return;
    }

    // Для списания делаем сумму отрицательной
    if (operation === 'subtract') {
        amount = -amount;
    }

    try {
        const response = await fetch(`/passengers/${passengerId}/balance`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ amount }),
        });

        if (response.ok) {
            const action = operation === 'add' ? 'Added' : 'Subtracted';
            showNotification(`${action} $${Math.abs(amount).toFixed(2)}`, 'success');
            input.value = '';
            await loadPassengers({{ station.id }});
        } else {
            const error = await response.json();
            showNotification(error.detail, 'error');
        }
    } catch (error) {
        showNotification('Network error', 'error');
    }
}
        // Create new passenger
        async function createPassenger(stationId) {
            const nameInput = document.getElementById('passengerName');
            const name = nameInput.value.trim();

            if (!name) {
                showNotification('Please enter passenger name', 'warning');
                return;
            }

            try {
                const response = await fetch(`/stations/${stationId}/passengers`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name }),
                });

                if (response.ok) {
                    showNotification('Passenger created successfully', 'success');
                    nameInput.value = '';
                    await loadPassengers(stationId);
                } else {
                    const error = await response.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        }

        //             showNotification(error.detail, 'error');
        //         }
        //     } catch (error) {
        //         showNotification('Network error', 'error');
        //     }
        // }

        // Update tariff
        async function updateTariff(passengerId, tariffId) {
            try {
                const response = await fetch(`/passengers/${passengerId}/tariff`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ tariff_id: parseInt(tariffId) }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        }

        // Toggle passenger status
        async function togglePassengerStatus(passengerId) {
            try {
                const response = await fetch(`/passengers/${passengerId}/status`, {
                    method: 'PATCH',
                });

                if (response.ok) {
                    const message = await response.json();
                    showNotification(message.message, 'success');
                    await loadPassengers({{ station.id }});
                } else {
                    const error = await response.json();
                    showNotification(error.detail, 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        }

        // Notification system
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.style.position = 'fixed';
            notification.style.bottom = '20px';
            notification.style.right = '20px';
            notification.style.padding = '1rem 2rem';
            notification.style.borderRadius = '8px';
            notification.style.color = 'white';
            notification.style.fontWeight = '500';
            notification.style.boxShadow = 'var(--shadow)';
            notification.style.zIndex = '1000';
            notification.textContent = message;
            notification.style.background = 
                type === 'success' ? '#10b981' :
                type === 'error' ? '#ef4444' :
                type === 'warning' ? '#f59e0b' : '#3b82f6';
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
    </script>
</body>
</html>
